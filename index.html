<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#55B3D9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bé phân loại rác cùng trí tuệ nhân tạo</title>
<!--
  Bé phân loại rác cùng trí tuệ nhân tạo
  - Chế độ "Bé dạy máy": bé đưa rác vào khung trên camera, giữ nút màu của thùng rác -> máy học.
  - Chế độ "Bắt đầu": máy nhận ra rác và chỉ đúng thùng.
  AI: mạng nơ-ron MobileNet trích đặc trưng ảnh + bộ phân loại KNN học ngay trên điện thoại.
  Máy chỉ nhìn phần ảnh TRONG KHUNG giữa camera (cả lúc dạy và lúc chơi).
  Dữ liệu bé dạy được lưu trong điện thoại (IndexedDB), không gửi đi đâu.

  ÂM THANH (thư mục am-thanh/, mỗi tệp có thể là .mp3, .m4a hoặc .wav):
    tai-che, huu-co, con-lai : giọng bé đọc hướng dẫn cho từng thùng
    chao                     : lời chào khi mở app (không bắt buộc)
  Thiếu tệp nào thì máy dùng giọng đọc tiếng Việt của điện thoại.
  Thư mục am-thanh/ có sẵn 4 tệp MẪU .mp3 (giọng máy). Thay bằng giọng bé: ghi đè tệp .mp3 cùng tên,
  hoặc chỉ cần thêm tệp .m4a/.wav cùng tên — tệp ghi âm luôn được ưu tiên hơn tệp mẫu.
-->
<style>
  :root { --bg:#f1f9fc; --text:#0c2a3e; --xanh:#55B3D9; --line:#bfe2f0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { overflow-x:hidden; }
  body { margin:0; min-height:100vh; min-height:100dvh; font-family:system-ui,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center;
         padding:max(8px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom)); user-select:none; -webkit-user-select:none; }
  header { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:520px; gap:8px; }
  h1 { margin:0; font-size:clamp(17px,5vw,28px); display:flex; align-items:center; gap:8px; min-width:0; }
  h1 .ten { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #anhBeNho { width:38px; height:38px; border-radius:50%; object-fit:cover; border:3px solid var(--xanh); flex:none; }
  #diem { font-size:22px; font-weight:800; white-space:nowrap; flex:none; }
  #tab { display:grid; grid-template-columns:1fr 1fr auto; gap:6px; width:100%; max-width:520px; margin-top:8px;
         background:#e3f3fa; padding:4px; border-radius:999px; }
  #tab button { border:0; border-radius:999px; padding:10px 6px; font-size:clamp(14px,4vw,18px); font-weight:800; white-space:nowrap;
                background:transparent; color:var(--text); }
  #tab button.chon { background:var(--xanh); box-shadow:0 1px 4px rgba(0,0,0,.12); }
  #tab #baMe { background:#fff; border:2px solid var(--line); padding:8px 12px; white-space:nowrap; }

  /* Camera + khung đặt rác */
  #khung { position:relative; width:min(92vw,40vh,400px); aspect-ratio:1; margin-top:10px; flex:none;
           border-radius:22px; overflow:hidden; background:#d5ecf6; border:4px solid var(--xanh); box-shadow:0 6px 18px rgba(0,0,0,.12); }
  #khung video { width:100%; height:100%; object-fit:cover; display:block; }
  #khung video.guong { transform:scaleX(-1); }
  #dich { position:absolute; left:15%; top:15%; width:70%; height:70%; border:4px dashed rgba(255,255,255,.95);
          border-radius:20px; box-shadow:0 0 0 999px rgba(12,42,62,.28); pointer-events:none; transition:border-color .15s; }
  #nhanDich { position:absolute; left:0; right:0; bottom:-34px; text-align:center; color:#fff; font-weight:800;
              font-size:clamp(12px,3.6vw,16px); white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  #demChup { position:absolute; top:10px; left:10px; background:rgba(12,42,62,.75); color:#fff; border-radius:999px;
             padding:5px 12px; font-weight:800; font-size:16px; display:none; }
  #nhay { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .12s; }
  #nhay.bat { opacity:.45; transition:none; }

  #loiNhan { min-height:2.4em; margin:8px 0 6px; font-size:clamp(16px,4.6vw,22px); font-weight:700; text-align:center; max-width:520px; }
  .luoi { display:grid; gap:8px; width:100%; max-width:520px; }
  #thung { grid-template-columns:repeat(3,1fr); }
  #day { grid-template-columns:repeat(2,1fr); }
  .thung { border-radius:16px; padding:8px 4px 10px; text-align:center; font-weight:800; color:#fff;
           font-size:clamp(14px,4vw,18px); opacity:.55; transition:transform .25s, opacity .25s; }
  .thung img { width:100%; aspect-ratio:1; object-fit:contain; display:block; margin-bottom:4px; }
  .thung.sang { opacity:1; transform:scale(1.1); }

  /* Nút dạy máy: giữ để chụp */
  .nutDay { position:relative; border:0; border-radius:18px; padding:10px 8px; color:#fff; font-weight:800;
            font-size:clamp(15px,4.3vw,19px); display:flex; align-items:center; gap:8px; text-align:left;
            touch-action:none; box-shadow:0 4px 0 rgba(0,0,0,.18); transition:transform .1s; }
  .nutDay img { width:48px; height:48px; object-fit:contain; flex:none; }
  .nutDay .so { display:block; font-size:clamp(13px,3.6vw,15px); font-weight:700; opacity:.95; }
  .nutDay.giu { transform:translateY(3px) scale(.97); box-shadow:0 1px 0 rgba(0,0,0,.18); outline:4px solid #fff; }
  .nutDay.du::after { content:"✓"; position:absolute; top:6px; right:10px; font-size:20px; }
  #goiY { font-size:14px; opacity:.75; text-align:center; margin:8px 0 0; max-width:520px; }
  .an { display:none !important; }

  /* Bảng dành cho ba mẹ */
  #nenBaMe { position:fixed; inset:0; background:rgba(12,42,62,.45); z-index:8; }
  #bangBaMe { position:fixed; left:0; right:0; bottom:0; z-index:9; background:#fff; border-radius:22px 22px 0 0;
              padding:16px 16px max(18px,env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto;
              box-shadow:0 -6px 24px rgba(0,0,0,.18); }
  #bangBaMe .dau { display:flex; justify-content:space-between; align-items:center; max-width:520px; margin:0 auto 10px; }
  #bangBaMe h2 { margin:0; font-size:20px; }
  #dongBaMe { width:44px; height:44px; border-radius:50%; border:0; background:#e3f3fa; font-size:20px; }
  #bangBaMe .ds { display:grid; gap:8px; max-width:520px; margin:0 auto; }
  #bangBaMe .ds button, #bangBaMe .ds label { display:flex; align-items:center; gap:10px; min-height:48px; padding:10px 14px;
              border:2px solid var(--line); background:#f7fbfd; border-radius:14px; font-size:16px; font-weight:700; color:var(--text); text-align:left; }
  #tinhTrang { max-width:520px; margin:12px auto 0; font-size:14px; line-height:1.5; color:#3d5a6e; }
  #ketQuaTep { max-width:520px; margin:10px auto 0; font-size:15px; line-height:1.5; font-weight:700; color:#1f6f91; }
  #ketQuaTep:empty { display:none; }

  #phu { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
         background:rgba(255,255,255,.94); z-index:5; text-align:center; padding:20px; }
  #phu.hien { display:flex; animation:hien .25s ease-out; }
  #phu img { width:min(70vw,55vh); aspect-ratio:1; object-fit:contain; }
  #phu .chu { font-size:clamp(26px,8vw,46px); font-weight:900; margin-top:10px; }
  #phu .mui { font-size:56px; animation:nhun .6s infinite alternate; }
  @keyframes hien { from { transform:scale(.8); opacity:0; } }
  @keyframes nhun { to { transform:translateY(12px); } }
  #cham { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10;
          background:rgba(12,42,62,.88); color:#fff; font-size:clamp(22px,6vw,32px); font-weight:800; text-align:center; padding:24px; }
  #cham .chao { display:flex; flex-direction:column; align-items:center; gap:14px; }
  #cham .tenSP { font-size:clamp(16px,4.5vw,20px); font-weight:700; opacity:.9; margin-top:-6px; }
  #anhBeLon { width:min(48vw,220px); aspect-ratio:1; border-radius:50%; object-fit:cover; border:6px solid #fff; }
  .sao { position:fixed; font-size:46px; pointer-events:none; animation:bay 1.2s ease-out forwards; z-index:7; }
  @keyframes bay { to { transform:translateY(-240px) scale(1.7); opacity:0; } }
</style>
</head>
<body data-che-do="day">
  <header>
    <h1><img id="anhBeNho" src="anh/be.jpg" alt="" onerror="this.remove()"><span class="ten">♻️ Bé Phân Loại Rác</span></h1>
    <div id="diem">⭐ 0</div>
  </header>
  <div id="tab"><button id="tabDay">🎓 Dạy máy</button><button id="tabChoi">Bắt đầu</button><button id="baMe" aria-label="Dành cho ba mẹ">⚙️ Ba mẹ</button></div>
  <div id="khung">
    <video id="video" playsinline muted autoplay></video>
    <div id="dich"><div id="nhanDich">Đưa rác vào khung này</div></div>
    <div id="demChup"></div>
    <div id="nhay"></div>
  </div>
  <div id="loiNhan">Đang mở camera...</div>

  <!-- Chế độ dạy máy -->
  <section id="cheDoDay" class="an" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="luoi" id="day"></div>
    <p id="goiY">Đưa rác vào khung, giữ nút màu và xoay rác nhiều phía. Mỗi nút cần ít nhất 30 hình.</p>
  </section>

  <!-- Chế độ chơi -->
  <section id="cheDoChoi" class="an" style="width:100%;display:flex;justify-content:center">
    <div class="luoi" id="thung"></div>
  </section>

  <!-- Bảng dành cho ba mẹ -->
  <div id="nenBaMe" class="an"></div>
  <div id="bangBaMe" class="an" role="dialog" aria-label="Dành cho ba mẹ">
    <div class="dau"><h2>⚙️ Dành cho ba mẹ</h2><button id="dongBaMe" aria-label="Đóng">✕</button></div>
    <div class="ds">
      <button id="thuAm">🔊 Thử âm thanh 3 thùng</button>
      <button id="doiCam">🔄 Đổi camera trước / sau</button>
      <button id="guiTep">📤 Gửi bài học (Zalo, Drive, Tệp...)</button>
      <button id="luuTep">💾 Tải bài học về máy</button>
      <label>📂 Nạp bài học từ tệp (chọn "Tệp"/"Files", không chọn Thư viện ảnh)<input type="file" id="napTep" hidden></label>
      <button id="veGoc">🌐 Lấy bài học mẫu (từ GitHub)</button>
      <button id="xoaHet">🗑️ Xóa hết, dạy lại</button>
    </div>
    <div id="ketQuaTep"></div>
    <div id="tinhTrang"></div>
  </div>

  <div id="phu"><div class="mui">⬇️</div><img alt=""><div class="chu"></div></div>
  <div id="cham"><div class="chao">
    <img id="anhBeLon" src="anh/be.jpg" alt="" onerror="this.remove()">
    <div id="loiChao">Xin chào!</div>
    <div class="tenSP">Bé phân loại rác cùng trí tuệ nhân tạo</div>
    <div>👆 Chạm vào màn hình để bắt đầu</div>
  </div></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.6/dist/knn-classifier.min.js"></script>
<script>
/* =================== CẤU HÌNH =================== */
// anh: ảnh chụp thùng rác thật (thư mục anh/); thiếu ảnh -> tự vẽ thùng theo màu
// amThanh: tên tệp giọng bé trong am-thanh/, KHÔNG ghi đuôi (.mp3, .m4a, .wav đều được)
const THUNG = {
  "Tai che": { ten:"Tái chế", mau:"#2e9e4f", anh:"anh/tai-che.jpg", amThanh:"am-thanh/tai-che",
               noi:"Rác tái chế! Bạn bỏ vào thùng màu xanh nhé!" },
  "Huu co":  { ten:"Hữu cơ",  mau:"#e6a700", anh:"anh/huu-co.jpg",  amThanh:"am-thanh/huu-co",
               noi:"Rác hữu cơ! Bạn bỏ vào thùng màu vàng nhé!" },
  "Con lai": { ten:"Còn lại", mau:"#4b5563", anh:"anh/con-lai.jpg", amThanh:"am-thanh/con-lai",
               noi:"Rác còn lại! Bạn bỏ vào thùng màu xám nhé!" }
};
const NEN = { ten:"Không có rác", mau:"#7c8a80" };   // lớp nền: chỉ có mặt bé, tay không
const LOP_NEN = "Khong co gi";
const TEN_BE = "Cát Uy";                 // ảnh bé đặt ở anh/be.jpg (không có thì tự ẩn)
const AM_CHAO = "am-thanh/chao";         // lời chào khi mở app (không bắt buộc)
const BAI_HOC_MAU = ["bai-hoc-mau.txt", "bai-hoc-mau.json"];  // bài học mẫu đi kèm app (tên nào cũng được)
const TEN_TEP_BAI_HOC = "bai-hoc-mau.txt";   // .txt để mọi điện thoại cho phép gửi/lưu
const DUOI_AM = ["m4a", "wav", "mp3"];   // ưu tiên tệp ghi âm (.m4a/.wav) hơn tệp mẫu .mp3
const TOI_THIEU = 30;          // số hình tối thiểu mỗi nút
const NHIP_CHUP_MS = 150;      // giữ nút: chụp ~6 hình/giây
const K = 10;                  // số "hàng xóm" KNN xem xét
const NGUONG = 0.8;            // độ chắc chắn tối thiểu khi chơi
const SO_KHUNG_ON_DINH = 8;
const HIEN_MS = 3500;
const KHUNG = 0.70;            // khung đặt rác = 70% giữa ảnh (khớp với #dich trong CSS)
/* ================================================ */

const $ = id => document.getElementById(id);
const video = $("video");
let net = null, boPhanLoai = null, camTruoc = true, luong = null;
let cheDo = "day", chay = false, dangTai = false, daCham = false;
let lopTruoc = "", demOnDinh = 0, nghiDen = 0, diem = 0, henLuu = null;

$("loiChao").textContent = `Xin chào! Mình là ${TEN_BE}.`;

/* ---------- Ảnh thùng rác ---------- */
function veThung(mau) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect x="22" y="14" width="56" height="9" rx="3" fill="${mau}"/><rect x="42" y="8" width="16" height="7" rx="2" fill="${mau}"/>
    <path d="M26 26h48l-5 64H31z" fill="${mau}"/>
    <path d="M40 36v44M50 36v44M60 36v44" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55"/></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function ganAnh(img, t, mauDuPhong = "#ffffff") {
  img.onerror = () => { img.onerror = null; img.src = veThung(mauDuPhong); };
  img.src = t.anh || veThung(mauDuPhong);
}
const maId = lop => lop.replace(/\s/g, "");

/* ---------- Dựng giao diện ---------- */
for (const [lop, t] of Object.entries(THUNG)) {
  const d = document.createElement("div");
  d.className = "thung"; d.id = "t-" + maId(lop); d.style.background = t.mau;
  const img = document.createElement("img"); ganAnh(img, t);
  const ten = document.createElement("div"); ten.textContent = t.ten;
  d.append(img, ten); $("thung").appendChild(d);
}
for (const [lop, t] of [...Object.entries(THUNG), [LOP_NEN, NEN]]) {
  const b = document.createElement("button");
  b.className = "nutDay"; b.id = "d-" + maId(lop); b.style.background = t.mau;
  const img = document.createElement("img");
  if (lop === LOP_NEN) img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="72" font-size="64" text-anchor="middle">🙋</text></svg>`);
  else ganAnh(img, t);
  const chu = document.createElement("div");
  chu.innerHTML = `${t.ten}<span class="so">📸 0 hình</span>`;
  b.append(img, chu); $("day").appendChild(b);
  ganGiuNut(b, lop);
}

/* ---------- Camera: máy chỉ nhìn phần trong khung ---------- */
const anhKhung = document.createElement("canvas");
anhKhung.width = anhKhung.height = 224;
const veKhung = anhKhung.getContext("2d", { willReadFrequently: true });
function catKhung() {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return null;
  const s = Math.min(w, h), canh = s * KHUNG;
  const x = (w - s) / 2 + (s - canh) / 2, y = (h - s) / 2 + (s - canh) / 2;
  veKhung.drawImage(video, x, y, canh, canh, 0, 0, 224, 224);
  return anhKhung;
}
async function moCamera() {
  if (luong) luong.getTracks().forEach(tr => tr.stop());
  luong = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: camTruoc ? "user" : "environment", width: { ideal: 640 }, height: { ideal: 640 } }, audio: false });
  video.srcObject = luong;
  video.classList.toggle("guong", camTruoc);
  await video.play();
  await new Promise(r => (video.readyState >= 2 ? r() : (video.onloadeddata = r)));
}

/* ---------- Âm thanh ---------- */
// Một "loa" dùng chung: được mở khóa ở lần chạm đầu tiên, sau đó phát được bất cứ lúc nào (kể cả iPhone).
const loa = new Audio();
loa.preload = "auto";
const tepAm = {};              // khóa -> blob URL của tệp giọng bé đã tải
let ngheAm = null, giongVi = null;
const IM_LANG = "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";  // 0,05 giây im lặng

async function taiAmThanh() {
  const ds = { chao: AM_CHAO };
  for (const [lop, t] of Object.entries(THUNG)) ds[lop] = t.amThanh;
  await Promise.all(Object.entries(ds).map(async ([khoa, goc]) => {
    for (const duoi of DUOI_AM) {
      try {
        const r = await fetch(`${goc}.${duoi}`);
        if (!r.ok) continue;
        const b = await r.blob();
        if (b.size < 500 || /html|text/.test(b.type)) continue;
        tepAm[khoa] = URL.createObjectURL(b);
        return;
      } catch (e) { /* thử đuôi khác */ }
    }
  }));
  capNhatTinhTrang();
}
function chonGiong() {
  if (!("speechSynthesis" in window)) return;
  giongVi = speechSynthesis.getVoices().find(v => /^vi/i.test(v.lang || "")) || null;
  capNhatTinhTrang();
}
if ("speechSynthesis" in window) { chonGiong(); speechSynthesis.onvoiceschanged = chonGiong; }

function moKhoaAmThanh() {               // gọi trong mỗi lần chạm
  try {
    ngheAm = ngheAm || new (window.AudioContext || window.webkitAudioContext)();
    if (ngheAm.state === "suspended") ngheAm.resume();
  } catch (e) {}
  if (!loa.dataset.moKhoa) {
    loa.src = IM_LANG;
    loa.play().then(() => { loa.dataset.moKhoa = "1"; }).catch(() => {});
    if ("speechSynthesis" in window) {   // mở khóa giọng đọc
      const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u);
    }
  }
}
function tiengTing() {                   // tiếng "ting" luôn phát được, kể cả khi không có giọng đọc
  if (!ngheAm) return;
  const t0 = ngheAm.currentTime;
  [[880, 0], [1320, 0.12]].forEach(([tanSo, tre]) => {
    const o = ngheAm.createOscillator(), g = ngheAm.createGain();
    o.type = "sine"; o.frequency.value = tanSo;
    g.gain.setValueAtTime(0.0001, t0 + tre);
    g.gain.exponentialRampToValueAtTime(0.35, t0 + tre + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + tre + 0.25);
    o.connect(g).connect(ngheAm.destination); o.start(t0 + tre); o.stop(t0 + tre + 0.3);
  });
}
function noiChu(cau) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  setTimeout(() => {                     // đợi một nhịp sau cancel(): tránh lỗi Chrome bỏ qua câu nói
    const u = new SpeechSynthesisUtterance(cau);
    u.lang = "vi-VN"; u.rate = 0.95;
    if (giongVi) u.voice = giongVi;
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  }, 120);
}
function phatAm(khoa, cau) {
  loa.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (tepAm[khoa]) {
    loa.src = tepAm[khoa]; loa.currentTime = 0;
    loa.play().catch(() => noiChu(cau));
  } else noiChu(cau);
}
function capNhatTinhTrang() {
  const coTep = Object.keys(THUNG).filter(l => tepAm[l]).length;
  const giong = !("speechSynthesis" in window) ? "không hỗ trợ"
    : giongVi ? `có (${giongVi.name})` : "chưa thấy giọng tiếng Việt";
  $("tinhTrang").innerHTML =
    `🎙️ Giọng bé: <b>${coTep}/3</b> tệp${tepAm.chao ? " + lời chào" : ""} (thư mục am-thanh/)<br>` +
    `🗣️ Giọng đọc tiếng Việt của máy: <b>${giong}</b><br>` +
    `<span style="opacity:.8">Có tệp giọng bé thì luôn phát được, kể cả khi máy không có giọng đọc tiếng Việt.</span>`;
}

/* ---------- Lưu / nạp bài học trong điện thoại (IndexedDB) ---------- */
function moKho() {
  return new Promise((ok, loi) => {
    const r = indexedDB.open("be-phan-loai-rac", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("baiHoc");
    r.onsuccess = () => ok(r.result); r.onerror = () => loi(r.error);
  });
}
async function khoGhi(giaTri) {
  const db = await moKho();
  return new Promise((ok, loi) => { const tx = db.transaction("baiHoc", "readwrite");
    tx.objectStore("baiHoc").put(giaTri, "boDuLieu"); tx.oncomplete = ok; tx.onerror = () => loi(tx.error); });
}
async function khoDoc() {
  const db = await moKho();
  return new Promise((ok, loi) => { const r = db.transaction("baiHoc").objectStore("baiHoc").get("boDuLieu");
    r.onsuccess = () => ok(r.result); r.onerror = () => loi(r.error); });
}
function xuatBoDuLieu() {
  const ds = boPhanLoai.getClassifierDataset(), out = {};
  for (const lop in ds) out[lop] = { shape: ds[lop].shape, data: new Float32Array(ds[lop].dataSync()) };
  return out;
}
function napBoDuLieu(obj) {
  boPhanLoai.clearAllClasses();
  const ds = {};
  for (const lop in obj) ds[lop] = tf.tensor(Float32Array.from(obj[lop].data), obj[lop].shape);
  if (Object.keys(ds).length) boPhanLoai.setClassifierDataset(ds);
}
async function napBaiHocMau() {
  for (const ten of BAI_HOC_MAU) {
    try {
      const r = await fetch(ten, { cache: "no-cache" });
      if (!r.ok) continue;
      napBoDuLieu(JSON.parse(await r.text()));
      await khoGhi(xuatBoDuLieu());
      return true;
    } catch (e) { console.warn("Không đọc được", ten, e); }
  }
  return false;
}
function henLuuBaiHoc() {
  clearTimeout(henLuu);
  henLuu = setTimeout(() => khoGhi(xuatBoDuLieu()).catch(console.error), 600);
}

/* ---------- Khởi động ---------- */
async function khoiDong() {
  if (dangTai || chay) return;
  dangTai = true;
  try {
    $("loiNhan").textContent = "Đang mở camera...";
    await moCamera();
    $("loiNhan").textContent = "Đang tải bộ não AI... (lần đầu cần mạng)";
    if (!net) net = await mobilenet.load({ version: 2, alpha: 1.0 });
    if (!boPhanLoai) {
      boPhanLoai = knnClassifier.create();
      let coBaiHoc = false;
      try {
        const daLuu = await khoDoc();
        if (daLuu !== undefined) { napBoDuLieu(daLuu); coBaiHoc = true; }   // kể cả khi đã "xóa hết"
      } catch (e) { console.warn(e); }
      if (!coBaiHoc) await napBaiHocMau();     // cài lần đầu: nạp bài học mẫu
    }
    chay = true;
    capNhatSoHinh();
    chuyenCheDo(daDayDu() ? "choi" : "day");
    giuManHinhSang();
    requestAnimationFrame(vongLap);
  } catch (e) {
    console.error(e);
    $("loiNhan").textContent = "Chưa mở được camera hoặc bộ não AI. Chạm để thử lại.";
  } finally { dangTai = false; }
}

/* ---------- Dạy máy: giữ nút để chụp ---------- */
function soHinh() { return boPhanLoai ? boPhanLoai.getClassExampleCount() : {}; }
function daDayDu() {
  const s = soHinh();
  return [...Object.keys(THUNG), LOP_NEN].every(l => (s[l] || 0) >= TOI_THIEU);
}
function capNhatSoHinh() {
  const s = soHinh();
  for (const lop of [...Object.keys(THUNG), LOP_NEN]) {
    const b = $("d-" + maId(lop)), n = s[lop] || 0;
    b.querySelector(".so").textContent = `📸 ${n} hình`;
    b.classList.toggle("du", n >= TOI_THIEU);
  }
}
function nhayFlash() {
  const n = $("nhay"); n.classList.add("bat");
  requestAnimationFrame(() => requestAnimationFrame(() => n.classList.remove("bat")));
}
function hocMotHinh(lop) {
  if (!chay || !net || video.readyState < 2) return false;
  const anh = catKhung(); if (!anh) return false;
  const dacTrung = net.infer(anh, true);
  boPhanLoai.addExample(dacTrung, lop);
  dacTrung.dispose();
  capNhatSoHinh(); nhayFlash();
  return true;
}
function ganGiuNut(nut, lop) {
  let hen = null, dem = 0;
  const batDau = e => {
    e.preventDefault();
    moKhoaAmThanh();
    if (!chay) { $("loiNhan").textContent = "Đợi camera và bộ não AI sẵn sàng nhé..."; return; }
    try { nut.setPointerCapture(e.pointerId); } catch (_) {}
    nut.classList.add("giu");
    const mau = (THUNG[lop] || NEN).mau;
    $("dich").style.borderColor = mau; $("dich").style.borderStyle = "solid";
    $("loiNhan").textContent = lop === LOP_NEN ? "Máy đang nhớ: lúc này không có rác" : `Máy đang học: rác ${THUNG[lop].ten.toLowerCase()}...`;
    dem = 0;
    const chup = () => { if (hocMotHinh(lop)) { dem++; $("demChup").textContent = `📸 +${dem}`; } };
    $("demChup").style.display = "block"; $("demChup").textContent = "📸 +0";
    chup();
    hen = setInterval(chup, NHIP_CHUP_MS);
  };
  const ketThuc = () => {
    if (!hen) return;
    clearInterval(hen); hen = null;
    nut.classList.remove("giu");
    $("dich").style.borderColor = ""; $("dich").style.borderStyle = "";
    setTimeout(() => { $("demChup").style.display = "none"; }, 1200);
    henLuuBaiHoc();
    $("loiNhan").textContent = daDayDu() ? "Giỏi quá! Máy đã học xong, bấm Bắt đầu để thử nhé!" : "Đưa món rác khác vào khung và dạy tiếp nào!";
    if (daDayDu()) noiChu("Giỏi quá! Máy đã học xong rồi!");
  };
  nut.addEventListener("pointerdown", batDau);
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => nut.addEventListener(ev, ketThuc));
  nut.addEventListener("contextmenu", e => e.preventDefault());
}

/* ---------- Chơi: nhận diện ---------- */
async function vongLap() {
  if (!chay) return;
  if (cheDo === "choi" && boPhanLoai.getNumClasses() >= 2 && video.readyState >= 2 && $("bangBaMe").classList.contains("an")) {
    const anh = catKhung();
    if (anh) {
      const dacTrung = net.infer(anh, true);
      const kq = await boPhanLoai.predictClass(dacTrung, K);
      dacTrung.dispose();
      const lop = (kq.confidences[kq.label] || 0) >= NGUONG ? kq.label : "";
      if (lop && lop === lopTruoc) demOnDinh++; else { lopTruoc = lop; demOnDinh = 0; }
      if (Date.now() > nghiDen && THUNG[lop] && demOnDinh >= SO_KHUNG_ON_DINH) {
        nhanRa(lop); nghiDen = Date.now() + HIEN_MS + 800; demOnDinh = 0;
      }
    }
  }
  setTimeout(() => requestAnimationFrame(vongLap), 60);
}

function nhanRa(lop) {
  const t = THUNG[lop], phu = $("phu");
  ganAnh(phu.querySelector("img"), t, t.mau);
  phu.querySelector(".chu").textContent = "Thùng " + t.ten;
  phu.querySelector(".chu").style.color = t.mau;
  phu.classList.add("hien");
  document.querySelectorAll(".thung").forEach(el => el.classList.remove("sang"));
  const o = $("t-" + maId(lop)); o.classList.add("sang");
  $("loiNhan").textContent = t.noi;
  setTimeout(() => { phu.classList.remove("hien"); o.classList.remove("sang");
                     if (cheDo === "choi") $("loiNhan").textContent = "Đưa rác tiếp theo vào khung nào!"; }, HIEN_MS);
  diem++; $("diem").textContent = "⭐ " + diem;
  baySao();
  tiengTing();
  setTimeout(() => phatAm(lop, t.noi), 350);
}

function chuyenCheDo(m) {
  cheDo = m;
  document.body.dataset.cheDo = m;
  $("cheDoDay").classList.toggle("an", m !== "day");
  $("cheDoChoi").classList.toggle("an", m !== "choi");
  $("tabDay").classList.toggle("chon", m === "day");
  $("tabChoi").classList.toggle("chon", m === "choi");
  if (m === "day") $("loiNhan").textContent = "Đưa rác vào khung, giữ nút màu để dạy máy!";
  else $("loiNhan").textContent = daDayDu() ? "Đưa rác vào khung nào!" : "Bé hãy dạy máy đủ 4 nút trước nhé!";
}

/* ---------- Hiệu ứng ---------- */
function baySao() {
  const s = document.createElement("div");
  s.className = "sao"; s.textContent = "⭐";
  s.style.left = (innerWidth / 2 - 23) + "px"; s.style.top = (innerHeight * 0.6) + "px";
  document.body.appendChild(s); setTimeout(() => s.remove(), 1300);
}
async function giuManHinhSang() {
  try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && chay) giuManHinhSang(); });

/* ---------- Bảng dành cho ba mẹ ---------- */
function moBaMe(mo) {
  $("nenBaMe").classList.toggle("an", !mo);
  $("bangBaMe").classList.toggle("an", !mo);
  if (mo) { capNhatTinhTrang(); baoKetQua(""); }
}
$("baMe").onclick = () => { moKhoaAmThanh(); moBaMe(true); };
$("dongBaMe").onclick = () => moBaMe(false);
$("nenBaMe").onclick = () => moBaMe(false);
$("thuAm").onclick = () => {
  moKhoaAmThanh();
  const ds = Object.entries(THUNG);
  ds.forEach(([lop, t], i) => setTimeout(() => { tiengTing(); setTimeout(() => phatAm(lop, t.noi), 350); }, i * 3500));
};
$("doiCam").onclick = async () => { camTruoc = !camTruoc; try { await moCamera(); } catch (e) { console.error(e); } moBaMe(false); };
$("xoaHet").onclick = async () => {
  if (!boPhanLoai || !confirm("Xóa toàn bộ những gì bé đã dạy máy?")) return;
  boPhanLoai.clearAllClasses(); await khoGhi({}); capNhatSoHinh();
  moBaMe(false); chuyenCheDo("day");
  $("loiNhan").textContent = "Đã xóa. Bé dạy lại từ đầu nhé!";
};
$("veGoc").onclick = async () => {
  if (!boPhanLoai || !confirm("Thay bài học trên máy này bằng bài học mẫu của Cát Uy?")) return;
  baoKetQua("Đang lấy bài học mẫu...");
  if (navigator.onLine && "caches" in window) {   // có mạng: bỏ bản cũ đã lưu để lấy bản mới nhất trên GitHub
    try { for (const k of await caches.keys()) for (const t of BAI_HOC_MAU) await (await caches.open(k)).delete(t); } catch (e) {}
  }
  const ok = await napBaiHocMau();
  capNhatSoHinh();
  const tong = Object.values(soHinh()).reduce((a, b) => a + b, 0);
  baoKetQua(ok ? `🌐 Đã lấy bài học mẫu (${tong} hình).` : "Chưa có bài học mẫu: hãy đưa tệp bai-hoc-mau.txt lên GitHub (lần đầu cần có mạng).");
  if (ok) chuyenCheDo(daDayDu() ? "choi" : "day");
};
/* Xuất bài học: tệp .txt chứa JSON (điện thoại Android chỉ cho "chia sẻ" tệp .txt, không cho .json) */
function taoTepBaiHoc() {
  if (!boPhanLoai) { alert("Đợi bộ não AI tải xong rồi lưu nhé."); return null; }
  const s = soHinh(), tong = Object.values(s).reduce((a, b) => a + b, 0);
  if (!tong) { alert("Máy chưa học hình nào, chưa có gì để lưu."); return null; }
  const obj = xuatBoDuLieu(), json = {};
  for (const l in obj) json[l] = { shape: obj[l].shape, data: Array.from(obj[l].data, x => +x.toFixed(4)) };
  const chu = JSON.stringify(json);
  const moTa = `${tong} hình, ${(chu.length / 1048576).toFixed(1)} MB`;
  return { tep: new File([chu], TEN_TEP_BAI_HOC, { type: "text/plain" }), moTa };
}
function baoKetQua(chu) { $("ketQuaTep").textContent = chu; }
function taiVeMay(tep, moTa) {
  const url = URL.createObjectURL(tep);
  const a = document.createElement("a");
  a.href = url; a.download = tep.name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  baoKetQua(`💾 Đã tải "${tep.name}" (${moTa}) vào thư mục Tải xuống. Không thấy tệp? Dùng nút 📤 Gửi bài học.`);
}
$("guiTep").onclick = async () => {
  const kq = taoTepBaiHoc(); if (!kq) return;
  const { tep, moTa } = kq;
  if (navigator.canShare && navigator.canShare({ files: [tep] })) {
    try {
      await navigator.share({ files: [tep], title: "Bài học phân loại rác" });
      baoKetQua(`📤 Đã gửi "${tep.name}" (${moTa}).`);
      return;
    } catch (e) {
      if (e.name === "AbortError") { baoKetQua("Đã hủy gửi."); return; }
      console.warn(e);
    }
  }
  taiVeMay(tep, moTa);   // máy không hỗ trợ chia sẻ tệp -> tải về
};
$("luuTep").onclick = () => {
  const kq = taoTepBaiHoc(); if (kq) taiVeMay(kq.tep, kq.moTa);
};
$("napTep").onchange = async e => {
  const f = e.target.files[0]; if (!f || !boPhanLoai) return;
  try {
    napBoDuLieu(JSON.parse(await f.text()));
    await khoGhi(xuatBoDuLieu()); capNhatSoHinh(); moBaMe(false);
    const tong = Object.values(soHinh()).reduce((a, b) => a + b, 0);
    $("loiNhan").textContent = `Đã nạp bài học (${tong} hình)!`;
  } catch (err) { alert("Tệp này không phải bài học. Hãy chọn tệp bai-hoc-mau.txt (hoặc .json)."); }
  e.target.value = "";
};

/* ---------- Bắt đầu ---------- */
$("cham").addEventListener("click", () => {
  $("cham").classList.add("an");
  moKhoaAmThanh();
  if (!daCham) { daCham = true; phatAm("chao", `Xin chào! Mình là ${TEN_BE}. Cùng phân loại rác nào!`); }
  khoiDong();
});
document.addEventListener("pointerdown", moKhoaAmThanh, { passive: true });
$("tabDay").onclick = () => chuyenCheDo("day");
$("tabChoi").onclick = () => chuyenCheDo("choi");

taiAmThanh();
khoiDong();   // tự bật camera nếu điện thoại đã cho phép từ trước
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
